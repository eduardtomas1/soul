name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Check the tag matches the version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node -e 'const { version } = require("./package.json"); if (process.env.RELEASE_TAG !== `v${version}`) { console.error(`Tag ${process.env.RELEASE_TAG} does not match version ${version}.`); process.exit(1); }'

  package:
    needs: verify
    uses: ./.github/workflows/package.yml

  publish:
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: soul-*
          path: release
          merge-multiple: true
      - name: Check packages and write checksums
        shell: bash
        run: |
          cd release
          version="${GITHUB_REF_NAME#v}"
          test "$(ls -- Soul-"${version}"-win-*.exe | wc -l)" -eq 2
          test "$(ls -- Soul-"${version}"-linux-*.AppImage | wc -l)" -eq 2
          sha256sum -- *.exe *.AppImage > SHA256SUMS
          sha256sum --check SHA256SUMS
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" release/* --verify-tag --draft --title "Soul $RELEASE_TAG" --notes-file docs/release-notes.md
          gh release edit "$RELEASE_TAG" --draft=false --latest
