name: Package

on:
  workflow_call:
    inputs:
      retention-days:
        type: number
        default: 7

permissions:
  contents: read

jobs:
  package:
    name: Package ${{ matrix.platform }} ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: windows-2025, platform: win, arch: x64 }
          - { runner: windows-11-arm, platform: win, arch: arm64 }
          - { runner: ubuntu-24.04, platform: linux, arch: x64 }
          - { runner: ubuntu-24.04-arm, platform: linux, arch: arm64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Check the runner's native architecture
        shell: bash
        env:
          PACKAGE_ARCH: ${{ matrix.arch }}
        run: node -e 'if (process.arch !== process.env.PACKAGE_ARCH) process.exit(1)'
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm run package:${{ matrix.platform }} -- --${{ matrix.arch }}
      - uses: actions/upload-artifact@v7
        with:
          name: soul-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            release/*.exe
            release/*.AppImage
          if-no-files-found: error
          retention-days: ${{ inputs.retention-days }}
